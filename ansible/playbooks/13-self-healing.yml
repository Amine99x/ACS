---
- name: KubeCloud Control Tower - Self Healing
  hosts: management
  become: true

  environment:
    PATH: "/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
    KUBECONFIG: "/etc/rancher/rke2/rke2.yaml"

  vars:
    remediation_dry_run: false

  tasks:

    - name: Initial drift detection
      ansible.builtin.include_role:
        name: drift_detection

    - name: Capture initial drift state
      ansible.builtin.set_fact:
        initial_drift_detected: "{{ remediation_required | default(false) | bool }}"
        initial_drift_label_mismatches: "{{ drift_label_mismatches | default([]) }}"
        initial_drift_missing_clusters: "{{ drift_missing_clusters | default([]) }}"
        initial_drift_unhealthy_clusters: "{{ drift_unhealthy_clusters | default([]) }}"
        initial_drift_fleet_drift: "{{ drift_fleet_drift | default(false) | bool }}"

    - name: Active remediation
      ansible.builtin.include_role:
        name: remediation

    - name: Re-run drift detection after remediation
      ansible.builtin.include_role:
        name: drift_detection

    - name: Capture final drift state
      ansible.builtin.set_fact:
        final_drift_detected: "{{ remediation_required | default(false) | bool }}"

    - name: Re-run health and compliance validation
      ansible.builtin.include_role:
        name: health_check

    - name: Generate final platform report
      ansible.builtin.include_role:
        name: reporting

    - name: Apply final Control Tower health gate
      ansible.builtin.include_role:
        name: platform_validation

    - name: Display self-healing summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "       KUBECLOUD SELF-HEALING SUMMARY"
          - "=============================================="
          - "Initial drift detected : {{ initial_drift_detected }}"
          - "Remediation performed  : {{ remediation_performed | default(false) }}"
          - "Final drift detected   : {{ final_drift_detected }}"
          - "Final compliance       : {{ health_score | default(0) }}%"
          - "=============================================="
