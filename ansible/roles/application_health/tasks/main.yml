---
- name: Check DEV NGINX deployment
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k3s kubectl
      -n {{ application_namespace }}
      get deployment {{ application_name }}
      -o jsonpath='{.status.availableReplicas}'
  register: application_dev_available
  changed_when: false
  failed_when: false
  delegate_to: kubecloud-dev

- name: Check PROD NGINX deployment
  ansible.builtin.command:
    cmd: >-
      kubectl
      -n {{ application_namespace }}
      get deployment {{ application_name }}
      -o jsonpath='{.status.availableReplicas}'
  environment:
    KUBECONFIG: "{{ application_prod_kubeconfig }}"
  register: application_prod_available
  changed_when: false
  failed_when: false
  delegate_to: kubecloud-prod

- name: Determine application health
  ansible.builtin.set_fact:
    application_dev_healthy: >-
      {{
        application_dev_available.rc == 0 and
        (application_dev_available.stdout | default('0') | int)
        >= application_expected_replicas
      }}

    application_prod_healthy: >-
      {{
        application_prod_available.rc == 0 and
        (application_prod_available.stdout | default('0') | int)
        >= application_expected_replicas
      }}

- name: Display application health
  ansible.builtin.debug:
    msg:
      - "=============================================="
      - "       KUBECLOUD APPLICATION HEALTH"
      - "=============================================="
      - "DEV NGINX  : {{ application_dev_available.stdout | default('0') }}/{{ application_expected_replicas }}"
      - "PROD NGINX : {{ application_prod_available.stdout | default('0') }}/{{ application_expected_replicas }}"
      - "DEV        : {{ 'HEALTHY' if application_dev_healthy else 'DEGRADED' }}"
      - "PROD       : {{ 'HEALTHY' if application_prod_healthy else 'DEGRADED' }}"
      - "=============================================="
