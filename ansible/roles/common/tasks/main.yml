---
- name: Install common system packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

- name: Load Kubernetes kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop: "{{ common_modules }}"
  changed_when: false

- name: Persist Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubecloud.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Configure Kubernetes sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubecloud-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1

- name: Apply sysctl configuration
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Verify swap is disabled
  ansible.builtin.command:
    cmd: swapon --show
  register: swap_status
  changed_when: false

- name: Display swap status
  ansible.builtin.debug:
    msg: "Swap status: {{ swap_status.stdout | default('disabled') }}"
