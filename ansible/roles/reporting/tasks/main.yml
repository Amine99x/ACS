---
- name: Create KubeCloud report directory
  ansible.builtin.file:
    path: "{{ report_output_dir }}"
    state: directory
    mode: "0755"

- name: Build report health labels
  ansible.builtin.set_fact:
    management_health: "{{ 'HEALTHY' if health_management_ok | bool else 'UNHEALTHY' }}"
    rancher_health: "{{ 'HEALTHY' if health_rancher_ok | bool else 'UNHEALTHY' }}"
    dev_health: "{{ 'HEALTHY' if health_dev_ok | bool else 'DRIFT DETECTED' }}"
    prod_health: "{{ 'HEALTHY' if health_prod_ok | bool else 'DRIFT DETECTED' }}"
    fleet_health: "{{ 'HEALTHY' if health_fleet_ok | bool else 'UNHEALTHY' }}"

- name: Build remediation audit data
  ansible.builtin.set_fact:
    report_remediation:
      performed: "{{ remediation_performed | default(false) | bool }}"
      actions: "{{ remediation_actions | default([]) }}"

- name: Generate KubeCloud platform report
  ansible.builtin.copy:
    dest: "{{ report_output_dir }}/{{ report_filename }}"
    mode: "0644"
    content: |
      {
        "platform": "KubeCloud Control Tower",
        "generated_at": "{{ ansible_date_time.iso8601 }}",

        "health": {
          "management": "{{ management_health }}",
          "rancher": "{{ rancher_health }}",
          "development": "{{ dev_health }}",
          "production": "{{ prod_health }}",
          "fleet": "{{ fleet_health }}",
          "operational_score": {{ health_score | int }}
        },

        "desired_state": {
          "initial_drift_detected": {{ initial_drift_detected | default(false) | bool | lower }},
          "final_drift_detected": {{ final_drift_detected | default(remediation_required | default(false)) | bool | lower }},

          "initial_label_mismatches": {{ initial_drift_label_mismatches | default([]) | to_json }},
          "missing_clusters": {{ initial_drift_missing_clusters | default([]) | to_json }},
          "unhealthy_clusters": {{ initial_drift_unhealthy_clusters | default([]) | to_json }},
          "fleet_drift": {{ initial_drift_fleet_drift | default(false) | bool | lower }}
        },

        "remediation": {{ report_remediation | to_json }},

        "managed_clusters": [
          "{{ rancher_dev_cluster_name }}",
          "{{ rancher_prod_cluster_name }}"
        ],

        "fleet": {
          "expected_clusters": {{ report_expected_fleet_clusters | int }},
          "actual_clusters": {{ drift_fleet_count | int }}
        },

        "overall_status": "{{ 'HEALTHY' if (health_score | int == report_expected_score and not (final_drift_detected | default(false) | bool)) else 'DEGRADED' }}"
      }

- name: Generate KubeCloud Prometheus metrics
  ansible.builtin.template:
    src: platform-health.prom.j2
    dest: "{{ report_output_dir }}/platform-health.prom"
    mode: "0644"

- name: Display generated report
  ansible.builtin.debug:
    msg:
      - "=============================================="
      - "       KUBECLOUD PLATFORM REPORT"
      - "=============================================="
      - "Report : {{ report_output_dir }}/{{ report_filename }}"
      - "Management : {{ management_health }}"
      - "Rancher    : {{ rancher_health }}"
      - "Development: {{ dev_health }}"
      - "Production : {{ prod_health }}"
      - "Fleet      : {{ fleet_health }}"
      - "Health     : {{ health_score | int }}%"
      - "Initial drift : {{ initial_drift_detected | default(false) }}"
      - "Final drift   : {{ final_drift_detected | default(false) }}"
      - "Remediation  : {{ remediation_performed | default(false) }}"
      - "Overall      : {{ 'HEALTHY' if (health_score | int == report_expected_score and not (final_drift_detected | default(false) | bool)) else 'DEGRADED' }}"
      - "=============================================="

