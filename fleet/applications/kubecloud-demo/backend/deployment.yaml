apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubecloud-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir "psycopg[binary]" &&
              python /app/app.py

          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"

          envFrom:
            - secretRef:
                name: postgres-credentials

          envFrom:
            - secretRef:
                name: postgres-credentials

          ports:
            - containerPort: 8000

          volumeMounts:
            - name: backend-code
              mountPath: /app

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: backend-code
          configMap:
            name: backend-code
