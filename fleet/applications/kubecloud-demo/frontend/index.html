<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KubeCloud Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 25px;
      margin-top: 20px;
    }

    input {
      width: 70%;
      padding: 10px;
      margin-right: 10px;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
    }

    .healthy {
      color: green;
      font-weight: bold;
    }

    .unhealthy {
      color: red;
      font-weight: bold;
    }

    li {
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <h1>KubeCloud Demo Application</h1>

  <div class="card">
    <h2>3-Tier Application</h2>

    <p>Frontend → Backend API → PostgreSQL</p>

    <p>
      Backend:
      <span id="backend">Checking...</span>
    </p>

    <p>
      Database:
      <span id="database">Checking...</span>
    </p>
  </div>

  <div class="card">
    <h2>Store Data</h2>

    <form id="messageForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Enter a message"
        required
      />

      <button type="submit">Save</button>
    </form>

    <p id="saveResult"></p>
  </div>

  <div class="card">
    <h2>Stored Data</h2>

    <ul id="items">
      <li>Loading...</li>
    </ul>
  </div>

  <script>

    async function checkStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();

        document.getElementById("backend").textContent =
          data.backend;

        document.getElementById("database").textContent =
          data.database;

        document.getElementById("backend").className =
          data.backend === "healthy" ? "healthy" : "unhealthy";

        document.getElementById("database").className =
          data.database === "healthy" ? "healthy" : "unhealthy";

      } catch (error) {
        document.getElementById("backend").textContent = "unreachable";
        document.getElementById("database").textContent = "unknown";
      }
    }


    async function loadItems() {
      try {
        const response = await fetch("/api/items");
        const data = await response.json();

        const list = document.getElementById("items");

        list.innerHTML = "";

        if (!data.items || data.items.length === 0) {
          list.innerHTML = "<li>No data stored yet.</li>";
          return;
        }

        for (const item of data.items) {
          const li = document.createElement("li");

          li.textContent =
            `#${item.id} — ${item.message} — ${item.created_at}`;

          list.appendChild(li);
        }

      } catch (error) {
        document.getElementById("items").innerHTML =
          "<li>Unable to load data.</li>";
      }
    }


    document
      .getElementById("messageForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const input =
          document.getElementById("messageInput");

        const result =
          document.getElementById("saveResult");

        try {

          const response = await fetch("/api/items", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: input.value
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Save failed");
          }

          result.textContent = "Saved successfully.";
          result.className = "healthy";

          input.value = "";

          await loadItems();

        } catch (error) {

          result.textContent =
            `Error: ${error.message}`;

          result.className = "unhealthy";
        }

      });


    checkStatus();
    loadItems();

  </script>

</body>
</html>
