apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kubecloud-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-credentials

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U kubecloud -d kubecloud
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U kubecloud -d kubecloud
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
